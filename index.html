<!DOCTYPE html>
<html>

<head>
    <title>Event Registration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h2>Event Registration Form</h2>

    <input id="n" placeholder="Full Name">
    <input id="e" placeholder="Email Address">
    <input id="p" placeholder="Phone Number">
    <input id="g" placeholder="Gender">
    <input id="c" placeholder="College Name">
    <input id="d" placeholder="Department">
    <input id="y" placeholder="Year of Study">
    <input id="v" placeholder="Event Selection">

    <br>
    <button onclick="reg()">Register</button>
    <button onclick="resetForm()">Reset</button>

    <p id="msg"></p>

    <script src="script.js"></script>
</body>

</html>
